debug_on 1
#the max wait time for every test case, when timeout, will kill this test case and return fail
max_time_wait_thead 1800
#each test file is 10mb
file_size_for_test  0xA00000
max_test_voltage 	3300000
min_test_voltage 	2900000
emmc_working_voltage 	3000000
voltage_chg_step 	50000
#unit is microsecond, so the total time is voltage_chg_wait_time*vol_step_chg_total_cnt
voltage_chg_wait_stime 	1
vol_wavy_stime 		600
#define the path depend on chipsets
misc_path		/dev/block/platform/bootdevice/by-name/misc
cache_path		/dev/block/platform/bootdevice/by-name/cache
emmc_vcc		/sys/class/regulator/regulator.28/microvolts
#print emmc cmd log
print_mmc_cmd_log 	0
